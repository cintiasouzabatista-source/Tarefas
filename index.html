<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f7fb;padding-bottom:90px}.header{background:#4f46e5;border-radius:0 0 22px 22px;padding:16px;color:#fff;position:relative}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.header small{opacity:.85}.header h1{font-size:22px;line-height:1.1}.date{display:inline-block;background:#fff;color:#4f46e5;padding:7px 10px;border-radius:99px;font-weight:700;font-size:13px;margin-top:8px}.mode{display:flex;background:rgba(255,255,255,.25);border-radius:99px;padding:3px}.mode button{border:0;padding:7px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer;background:transparent;color:#fff}.mode button.active{background:#fff;color:#4f46e5}.right{display:flex;gap:8px;align-items:center;position:relative}.dots{width:38px;height:38px;border-radius:50%;border:0;background:#fff;font-size:20px;font-weight:800;cursor:pointer;color:#4f46e5}.menu3{display:none;position:absolute;right:0;top:48px;width:200px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;flex-direction:column;gap:8px}.menu3.open{display:flex}.menu3 button{border:0;padding:11px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer;text-align:left}.c-purple{background:#4f46e5;color:#fff}.c-green{background:#22c55e;color:#fff}.c-orange{background:#f59e0b;color:#fff}.c-white{background:#fff;color:#111;border:1px solid #ddd!important}.c-red{background:#ef4444;color:#fff}.wrap{padding:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;overflow:hidden;margin-bottom:12px}.card-top{padding:14px;display:flex;justify-content:space-between;cursor:pointer}.who{display:flex;gap:10px;align-items:center}.avatar{font-size:34px}.who b{font-size:19px}.who span{font-size:13px;color:#9ca3af}.money{text-align:right}.money b{color:#059669;font-size:19px}.money span{font-size:13px;color:#9ca3af;display:block}.week{display:flex;justify-content:space-between;padding:0 14px 10px;font-size:13px;color:#6b7280}.bar{height:8px;background:#eef2f7;border-radius:99px;margin:0 14px 12px;overflow:hidden}.bar i{display:block;height:100%;background:#4f46e5;width:0}.tasks{display:none;padding:0 14px 12px}.card.open .tasks{display:block}.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #eee}.task input{width:22px;height:22px;accent-color:#22c55e}.task.done label{text-decoration:line-through;color:#9ca3af}.task em{margin-left:auto;font-style:normal;font-weight:700;font-size:13px;color:#059669}.toggle{background:#eef0f3;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;color:#6b7280;font-size:14px;cursor:pointer}.days{background:#fff;border:1px solid #e5e7eb;border-radius:99px;display:flex;padding:6px;margin:10px 0 16px}.days button{flex:1;border:0;background:transparent;padding:11px 0;border-radius:14px;font-weight:600;color:#6b7280;cursor:pointer}.days button.active{background:#4f46e5;color:#fff}.backup{background:#fffbe6;border:1px solid #fde68a;border-radius:22px;padding:16px}.backup b{color:#78350f;font-size:17px}.backup p{color:#78350f;font-size:14px;margin:10px 0 14px}.finish{width:100%;border:0;background:#f59e0b;color:#fff;font-weight:800;font-size:17px;padding:15px;border-radius:15px;cursor:pointer}.fab{position:fixed;right:16px;bottom:20px;z-index:90;text-align:right}.fab-menu{display:none;flex-direction:column;gap:8px;align-items:flex-end;margin-bottom:10px}.fab.open .fab-menu{display:flex}.fab-menu button{border:0;padding:11px 16px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}.fab-main{width:58px;height:58px;border-radius:50%;background:#4f46e5;color:#fff;font-size:34px;border:0;box-shadow:0 8px 20px rgba(79,70,229,.4);cursor:pointer}.fab.open .fab-main{transform:rotate(45deg)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:360px}.box h2{font-size:18px;margin-bottom:12px}.box label{font-size:13px;color:#666}.box input,.box select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px;font-size:15px}.box button{width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}.row{display:flex;gap:8px}.row button{flex:1}body.filhos .only-pais,body.filhos .edit,body.filhos .fab,body.filhos .dots{display:none!important}</style></head><body><div class="header"><div class="top"><div><small>Minhas Tarefas</small><h1>Tarefas da Semana</h1><span class="date" id="d"></span></div><div class="right"><div class="mode"><button id="bPais" class="active" onclick="setMode('pais')">Pais</button><button id="bFilhos" onclick="setMode('filhos')">Filhos</button></div><button class="dots only-pais" onclick="toggle3(event)">⋮</button><div class="menu3" id="menu3"><button class="c-orange" onclick="openModal('valor')">💰 Valor</button><button class="c-green" onclick="openModal('fechar')">Fechar Semana</button><button class="c-white" onclick="openModal('backup')">Importar Backup</button><button class="c-red" onclick="zerar()">Zerar Checks</button><button class="c-white" onclick="openModal('pin')">Trocar PIN</button><button class="c-orange" onclick="openModal('premio')">🏆 Prêmios</button></div></div></div></div><div class="wrap" id="lista"><div class="card" id="r"><div class="card-top" onclick="t('r')"><div class="who"><div class="avatar">🐋</div><div><b>Rafaella <span class="edit">✏️🗑️🔄</span></b><br><span>0 XP</span></div></div><div class="money"><b>R$ 0,00</b><span>0 pt(s)</span></div></div><div class="week"><span>Semana</span><b>0/0 (0%)</b></div><div class="bar"><i></i></div><div class="tasks"><label class="task"><input type="checkbox" checked onchange="this.parentElement.classList.toggle('done')"><label>Arrumar a cama</label><em>10 pts</em></label><label class="task"><input type="checkbox" onchange="this.parentElement.classList.toggle('done')"><label>Escovar os dentes</label><em>10 pts</em></label></div><div class="toggle" onclick="t('r')">2 tarefas - toque para abrir <span>⌄</span></div></div><div class="card" id="s"><div class="card-top" onclick="t('s')"><div class="who"><div class="avatar">🦋</div><div><b>Sophya <span class="edit">✏️🗑️🔄</span></b><br><span>0 XP</span></div></div><div class="money"><b>R$ 0,00</b><span>0 pt(s)</span></div></div><div class="week"><span>Semana</span><b>0/0 (0%)</b></div><div class="bar"><i></i></div><div class="tasks"><label class="task"><input type="checkbox" checked onchange="this.parentElement.classList.toggle('done')"><label>Guardar os brinquedos</label><em>10 pts</em></label><label class="task"><input type="checkbox" onchange="this.parentElement.classList.toggle('done')"><label>Ler 10 minutos</label><em>15 pts</em></label></div><div class="toggle" onclick="t('s')">2 tarefas - toque para abrir <span>⌄</span></div></div></div><div class="wrap" style="padding-top:0"><div class="days"><button>Seg</button><button>Ter</button><button>Qua</button><button class="active">Qui</button><button>Sex</button><button>Sáb</button><button>Dom</button></div><div class="backup only-pais"><b>📦 Backup da Semana</b><p>Mande o código pra mamãe.</p><button class="finish" onclick="openModal('backup')">📦 Finalizar Dia</button></div></div><div class="fab only-pais" id="fab"><div class="fab-menu"><button class="c-purple" onclick="openModal('filho')">+ Filho(a)</button><button class="c-green" onclick="openModal('tarefa')">+ Tarefa</button></div><button class="fab-main" onclick="document.getElementById('fab').classList.toggle('open')">+</button></div><div class="modal" id="modal"><div class="box"><h2 id="mt">Adicionar</h2><div id="mc"></div><div class="row" style="margin-top:10px"><button onclick="closeModal()" style="background:#eee">Cancelar</button><button id="msave" style="background:#4f46e5;color:#fff">Salvar</button></div></div></div><script>let PIN='1234';function t(i){document.getElementById(i).classList.toggle('open')}function toggle3(e){e.stopPropagation();document.getElementById('menu3').classList.toggle('open');document.getElementById('fab').classList.remove('open')}function setMode(m){if(m==='filhos'){document.body.classList.add('filhos');document.getElementById('bFilhos').classList.add('active');document.getElementById('bPais').classList.remove('active')}else{let p=prompt('Digite o PIN de Pais');if(p===null)return;if(p===PIN){document.body.classList.remove('filhos');document.getElementById('bPais').classList.add('active');document.getElementById('bFilhos').classList.remove('active')}else alert('PIN incorreto')}document.getElementById('menu3').classList.remove('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function openModal(tipo){document.getElementById('menu3').classList.remove('open');document.getElementById('fab').classList.remove('open');let mt=document.getElementById('mt'),mc=document.getElementById('mc'),sv=document.getElementById('msave');document.getElementById('modal').classList.add('open');if(tipo==='filho'){mt.textContent='+ Filho(a)';mc.innerHTML='<label>Nome</label><input id="f1" placeholder="Ex: Rafaella"><label>Emoji</label><input id="f2" placeholder="🐋" value="⭐">';sv.onclick=()=>{let n=document.getElementById('f1').value||'Filho(a)';let e=document.getElementById('f2').value||'⭐';let id='c'+Date.now();document.getElementById('lista').insertAdjacentHTML('beforeend','<div class=\"card open\" id=\"'+id+'\"><div class=\"card-top\" onclick=\"t(\\''+id+'\\')\"><div class=\"who\"><div class=\"avatar\">'+e+'</div><div><b>'+n+'</b><br><span>0 XP</span></div></div><div class=\"money\"><b>R$ 0,00</b><span>0 pt(s)</span></div></div><div class=\"tasks\"></div><div class=\"toggle\" onclick=\"t(\\''+id+'\\')\">0 tarefas - toque para abrir</div></div>');closeModal()}}if(tipo==='tarefa'){mt.textContent='+ Tarefa';mc.innerHTML='<label>Para quem?</label><select id="f1"><option>Rafaella</option><option>Sophya</option></select><label>Tarefa</label><input id="f2" placeholder=\"Ex: Arrumar a cama\"><label>Pontos</label><input id=\"f3\" type=\"number\" value=\"10\">';sv.onclick=()=>{let quem=document.getElementById('f1').value;let txt=document.getElementById('f2').value||'Nova tarefa';let pts=document.getElementById('f3').value||10;let card=quem==='Rafaella'?document.querySelector('#r .tasks'):document.querySelector('#s .tasks');if(card){card.insertAdjacentHTML('beforeend','<label class=\"task\"><input type=\"checkbox\" onchange=\"this.parentElement.classList.toggle(\\'done\\')\"><label>'+txt+'</label><em>'+pts+' pts</em></label>')}closeModal()}}if(tipo==='valor'){mt.textContent='💰 Valor por ponto';mc.innerHTML='<label>Quanto vale 1 ponto? (R$)</label><input id=\"f1\" type=\"number\" step=\"0.10\" value=\"0.50\">';sv.onclick=()=>{alert('Valor salvo: R$ '+document.getElementById('f1').value);closeModal()}}if(tipo==='fechar'){mt.textContent='Fechar Semana';mc.innerHTML='<p>Isso zera os checks e calcula o total da semana. Deseja continuar?</p>';sv.onclick=()=>{zerar();alert('Semana fechada! 🎉');closeModal()}}if(tipo==='backup'){mt.textContent='Backup';mc.innerHTML='<label>Cole o código de backup</label><input id=\"f1\" placeholder=\"Cole aqui...\">';sv.onclick=()=>{alert('Backup importado!');closeModal()}}if(tipo==='pin'){mt.textContent='Trocar PIN';mc.innerHTML='<label>Novo PIN</label><input id=\"f1\" placeholder=\"1234\">';sv.onclick=()=>{PIN=document.getElementById('f1').value||PIN;alert('PIN trocado!');closeModal()}}if(tipo==='premio'){mt.textContent='🏆 Prêmios';mc.innerHTML='<label>Prêmio</label><input id=\"f1\" placeholder=\"Ex: 100 pts = sorvete\"><label>Pontos necessários</label><input id=\"f2\" type=\"number\" value=\"100\">';sv.onclick=()=>{alert('Prêmio salvo: '+document.getElementById('f1').value);closeModal()}}}function zerar(){document.querySelectorAll('.task input').forEach(c=>{c.checked=false;c.parentElement.classList.remove('done')})}document.getElementById('d').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});document.querySelectorAll('.days button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.days button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}});document.addEventListener('click',e=>{if(!e.target.closest('.right'))document.getElementById('menu3').classList.remove('open');if(!e.target.closest('.fab'))document.getElementById('fab').classList.remove('open');if(e.target.id==='modal')closeModal()})</script></body></html>
