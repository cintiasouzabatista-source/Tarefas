<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarefas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f6f7fb;padding-bottom:90px}
.header{background:#4f46e5;padding:16px;color:#fff;border-radius:0 0 22px 22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.date{display:inline-block;background:#fff;color:#4f46e5;padding:7px 10px;border-radius:99px;font-weight:700;font-size:13px;margin-top:8px}
.mode{display:flex;background:rgba(255,255,255,.25);border-radius:99px;padding:3px}
.mode button{border:0;padding:7px 12px;border-radius:99px;font-weight:700;cursor:pointer;background:transparent;color:#fff}
.mode button.active{background:#fff;color:#4f46e5}
.dots{width:38px;height:38px;border-radius:50%;border:0;background:#fff;font-size:20px;font-weight:800;cursor:pointer;color:#4f46e5}
.right{position:relative;display:flex;gap:8px;align-items:center}
.menu3{display:none;position:absolute;right:0;top:48px;width:200px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;flex-direction:column;gap:8px}
.menu3.open{display:flex}
.menu3 button{border:0;padding:11px;border-radius:99px;font-weight:700;cursor:pointer;text-align:left}
.wrap{padding:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;margin-bottom:12px;overflow:hidden}
.card-top{padding:14px;display:flex;justify-content:space-between;cursor:pointer}
.tasks{display:none;padding:0 14px 12px}
.card.open .tasks{display:block}
.task{display:flex;gap:10px;padding:10px 0;border-top:1px dashed #eee;align-items:center}
.fab{position:fixed;right:16px;bottom:20px;z-index:90;text-align:right}
.fab-menu{display:none;flex-direction:column;gap:8px;margin-bottom:10px;align-items:flex-end}
.fab.open .fab-menu{display:flex}
.fab-menu button{border:0;padding:11px 16px;border-radius:99px;font-weight:700;cursor:pointer}
.fab-main{width:58px;height:58px;border-radius:50%;background:#4f46e5;color:#fff;font-size:32px;border:0;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:360px}
.box input,.box select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px;font-size:15px}
.box button{width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;cursor:pointer;margin-top:6px}
body.filhos .only-pais{display:none}
</style></head>
<body>
<div class="header"><div class="top"><div><small>Minhas Tarefas</small><h1 style="font-size:22px">Tarefas da Semana</h1><span class="date">Qui, 19 de Nov</span></div>
<div class="right"><div class="mode"><button id="bPais" class="active">Pais</button><button id="bFilhos">Filhos</button></div>
<button class="dots only-pais" id="btnDots">⋮</button>
<div class="menu3" id="menu3"><button style="background:#f59e0b;color:#fff" id="mValor">Valor</button><button style="background:#22c55e;color:#fff" id="mFechar">Fechar Semana</button><button style="background:#fff;border:1px solid #ddd" id="mBackup">Importar Backup</button><button style="background:#ef4444;color:#fff" id="mZerar">Zerar Checks</button><button style="background:#fff;border:1px solid #ddd" id="mPin">Trocar PIN</button><button style="background:#f59e0b;color:#fff" id="mPremio">Premios</button></div></div></div></div>
<div class="wrap" id="lista">
<div class="card open" id="cardRafa"><div class="card-top"><b>Rafaella - 0 XP</b><b style="color:#059669">R$ 0,00</b></div><div class="tasks"><label class="task"><input type="checkbox" checked><span>Arrumar a cama</span><b>10 pts</b></label><label class="task"><input type="checkbox"><span>Escovar os dentes</span><b>10 pts</b></label></div><div style="background:#eef0f3;padding:11px 14px;font-size:14px;color:#666">2 tarefas - toque para abrir / fechar</div></div>
<div class="card open" id="cardSoph"><div class="card-top"><b>Sophya - 0 XP</b><b style="color:#059669">R$ 0,00</b></div><div class="tasks"><label class="task"><input type="checkbox" checked><span>Guardar os brinquedos</span><b>10 pts</b></label><label class="task"><input type="checkbox"><span>Ler 10 minutos</span><b>15 pts</b></label></div><div style="background:#eef0f3;padding:11px 14px;font-size:14px;color:#666">2 tarefas - toque para abrir / fechar</div></div>
</div>
<div class="fab only-pais" id="fab"><div class="fab-menu"><button style="background:#4f46e5;color:#fff" id="btnFilho">+ Filho(a)</button><button style="background:#22c55e;color:#fff" id="btnTarefa">+ Tarefa</button></div><button class="fab-main" id="btnFab">+</button></div>
<div class="modal" id="modalFilho"><div class="box"><h2>+ Filho(a)</h2><label>Nome</label><input id="inNome" placeholder="Ex: Rafaella"><label>Emoji</label><input id="inEmoji" value="⭐"><button style="background:#4f46e5;color:#fff" id="saveFilho">Salvar</button><button style="background:#eee" class="fechar">Cancelar</button></div></div>
<div class="modal" id="modalTarefa"><div class="box"><h2>+ Tarefa</h2><label>Para quem?</label><select id="selQuem"><option>Rafaella</option><option>Sophya</option></select><label>Tarefa</label><input id="inTarefa" placeholder="Ex: Arrumar a cama"><label>Pontos</label><input id="inPts" type="number" value="10"><button style="background:#22c55e;color:#fff" id="saveTarefa">Salvar</button><button style="background:#eee" class="fechar">Cancelar</button></div></div>
<div class="modal" id="modalSimples"><div class="box"><h2 id="titSimples">Acao</h2><p id="txtSimples">Feito!</p><button style="background:#4f46e5;color:#fff" class="fechar">OK</button></div></div>
<script>
var PIN = "1234";
function fecharTudo(){document.querySelectorAll(".modal").forEach(function(m){m.classList.remove("open")});document.getElementById("menu3").classList.remove("open");document.getElementById("fab").classList.remove("open")}
function abrirModal(id){fecharTudo();document.getElementById(id).classList.add("open")}
document.getElementById("btnDots").addEventListener("click",function(e){e.stopPropagation();var m=document.getElementById("menu3");var aberto=m.classList.contains("open");fecharTudo();if(!aberto){m.classList.add("open")}});
document.getElementById("btnFab").addEventListener("click",function(e){e.stopPropagation();document.getElementById("fab").classList.toggle("open")});
document.getElementById("btnFilho").addEventListener("click",function(){abrirModal("modalFilho")});
document.getElementById("btnTarefa").addEventListener("click",function(){abrirModal("modalTarefa")});
document.getElementById("mValor").addEventListener("click",function(){document.getElementById("titSimples").textContent="Valor";document.getElementById("txtSimples").textContent="Valor por ponto: R$ 0,50. Para trocar, fale comigo que eu ajusto.";abrirModal("modalSimples")});
document.getElementById("mFechar").addEventListener("click",function(){document.getElementById("titSimples").textContent="Fechar Semana";document.getElementById("txtSimples").textContent="Semana fechada!";abrirModal("modalSimples")});
document.getElementById("mBackup").addEventListener("click",function(){document.getElementById("titSimples").textContent="Importar Backup";document.getElementById("txtSimples").textContent="Cole o codigo de backup aqui na proxima versao.";abrirModal("modalSimples")});
document.getElementById("mZerar").addEventListener("click",function(){document.querySelectorAll(".task input").forEach(function(c){c.checked=false});document.getElementById("titSimples").textContent="Zerar Checks";document.getElementById("txtSimples").textContent="Todos os checks foram zerados.";abrirModal("modalSimples")});
document.getElementById("mPin").addEventListener("click",function(){var novo=prompt("Digite o novo PIN:");if(novo){PIN=novo;alert("PIN trocado!")} });
document.getElementById("mPremio").addEventListener("click",function(){document.getElementById("titSimples").textContent="Premios";document.getElementById("txtSimples").textContent="Ex: 100 pts = sorvete";abrirModal("modalSimples")});
document.querySelectorAll(".fechar").forEach(function(b){b.addEventListener("click",fecharTudo)});
document.getElementById("bPais").addEventListener("click",function(){var p=prompt("Digite o PIN de Pais:");if(p===null){return}if(p===PIN){document.body.classList.remove("filhos");document.getElementById("bPais").classList.add("active");document.getElementById("bFilhos").classList.remove("active")}else{alert("PIN incorreto")}});
document.getElementById("bFilhos").addEventListener("click",function(){document.body.classList.add("filhos");document.getElementById("bFilhos").classList.add("active");document.getElementById("bPais").classList.remove("active");fecharTudo()});
document.querySelectorAll(".card-top").forEach(function(top){top.addEventListener("click",function(){top.parentElement.classList.toggle("open")})});
document.getElementById("saveFilho").addEventListener("click",function(){var nome=document.getElementById("inNome").value||"Filho(a)";var emoji=document.getElementById("inEmoji").value||"⭐";var div=document.createElement("div");div.className="card open";div.innerHTML="<div class='card-top'><b>"+emoji+" "+nome+" - 0 XP</b><b style='color:#059669'>R$ 0,00</b></div><div class='tasks'></div>";var top=div.querySelector(".card-top");top.addEventListener("click",function(){div.classList.toggle("open")});document.getElementById("lista").appendChild(div);fecharTudo()});
document.getElementById("saveTarefa").addEventListener("click",function(){var quem=document.getElementById("selQuem").value;var txt=document.getElementById("inTarefa").value||"Nova tarefa";var pts=document.getElementById("inPts").value||"10";var card=null;if(quem==="Rafaella"){card=document.getElementById("cardRafa")}else{card=document.getElementById("cardSoph")};if(card){var box=card.querySelector(".tasks");var lab=document.createElement("label");lab.className="task";var chk=document.createElement("input");chk.type="checkbox";var sp=document.createElement("span");sp.textContent=txt;var b=document.createElement("b");b.textContent=pts+" pts";lab.appendChild(chk);lab.appendChild(sp);lab.appendChild(b);box.appendChild(lab);card.classList.add("open")}fecharTudo()});
document.addEventListener("click",function(e){if(!e.target.closest(".right")&&!e.target.closest(".fab")){fecharTudo()}});
</script></body></html>
