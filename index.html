<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f7fb;padding-bottom:110px}.header{background:#4f46e5;border-radius:0 0 22px 22px;padding:16px;display:flex;justify-content:space-between;align-items:center;color:#fff}.header small{opacity:.85}.header h1{font-size:22px;line-height:1.1}.date{background:#fff;color:#4f46e5;padding:9px 12px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap}.wrap{padding:14px 14px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;overflow:hidden;margin-bottom:12px}.card-top{padding:14px 14px 10px;display:flex;justify-content:space-between;cursor:pointer}.who{display:flex;gap:10px;align-items:center}.avatar{font-size:34px}.who b{font-size:19px;color:#111827}.who span{font-size:13px;color:#9ca3af}.money{text-align:right}.money b{color:#059669;font-size:19px}.money span{font-size:13px;color:#9ca3af;display:block}.week{display:flex;justify-content:space-between;padding:0 14px 10px;font-size:13px;color:#6b7280}.bar{height:8px;background:#eef2f7;border-radius:99px;margin:0 14px 12px;overflow:hidden}.bar i{display:block;height:100%;background:#4f46e5;width:0}.tasks{display:none;padding:0 14px 12px}.card.open .tasks{display:block}.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #eee}.task input{width:22px;height:22px;accent-color:#22c55e}.task.done label{text-decoration:line-through;color:#9ca3af}.task em{margin-left:auto;font-style:normal;font-weight:700;font-size:13px;color:#059669}.toggle{background:#eef0f3;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;color:#6b7280;font-size:14px;cursor:pointer}.toggle span{width:28px;height:28px;background:#fff;border-radius:50%;display:grid;place-items:center;border:1px solid #ddd}.card.open .toggle span{transform:rotate(180deg)}.days{background:#fff;border:1px solid #e5e7eb;border-radius:99px;display:flex;padding:6px;margin:10px 0 16px}.days button{flex:1;border:0;background:transparent;padding:11px 0;border-radius:14px;font-weight:600;color:#6b7280;cursor:pointer}.days button.active{background:#4f46e5;color:#fff}.backup{background:#fffbe6;border:1px solid #fde68a;border-radius:22px;padding:16px}.backup b{color:#78350f;font-size:17px}.backup p{color:#78350f;font-size:14px;margin:10px 0 14px}.finish{width:100%;border:0;background:#f59e0b;color:#fff;font-weight:800;font-size:17px;padding:15px;border-radius:15px;cursor:pointer}.fab{position:fixed;right:16px;bottom:20px;z-index:50}.fab-main{width:58px;height:58px;border-radius:50%;background:#4f46e5;color:#fff;font-size:34px;border:0;box-shadow:0 8px 20px rgba(79,70,229,.4);cursor:pointer}.fab.open .fab-main{transform:rotate(45deg)}.fab-menu{display:none;flex-direction:column;gap:8px;align-items:flex-end;margin-bottom:10px}.fab.open .fab-menu{display:flex}.fab-menu button{border:0;padding:10px 14px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);white-space:nowrap}.c-purple{background:#4f46e5;color:#fff}.c-green{background:#22c55e;color:#fff}.c-orange{background:#f59e0b;color:#fff}.c-white{background:#fff;color:#111}.c-red{background:#ef4444;color:#fff}</style></head><body><div class="header"><div><small>Minhas Tarefas</small><h1>Tarefas da Semana</h1></div><span class="date" id="d"></span></div><div class="wrap"><div class="card" id="r"><div class="card-top" onclick="t('r')"><div class="who"><div class="avatar">🐋</div><div><b>Rafaella ✏️🗑️🔄</b><br><span>0 XP</span></div></div><div class="money"><b>R$ 0,00</b><span>0 pt(s)</span></div></div><div class="week"><span>Semana</span><b>0/0 (0%)</b></div><div class="bar"><i></i></div><div class="tasks"><label class="task"><input type="checkbox" checked onchange="this.parentElement.classList.toggle('done')"><label>Arrumar a cama</label><em>10 pts</em></label><label class="task"><input type="checkbox" onchange="this.parentElement.classList.toggle('done')"><label>Escovar os dentes</label><em>10 pts</em></label></div><div class="toggle" onclick="t('r')">2 tarefas - toque para abrir <span>⌄</span></div></div><div class="card" id="s"><div class="card-top" onclick="t('s')"><div class="who"><div class="avatar">🦋</div><div><b>Sophya ✏️🗑️🔄</b><br><span>0 XP</span></div></div><div class="money"><b>R$ 0,00</b><span>0 pt(s)</span></div></div><div class="week"><span>Semana</span><b>0/0 (0%)</b></div><div class="bar"><i></i></div><div class="tasks"><label class="task"><input type="checkbox" checked onchange="this.parentElement.classList.toggle('done')"><label>Guardar os brinquedos</label><em>10 pts</em></label><label class="task"><input type="checkbox" onchange="this.parentElement.classList.toggle('done')"><label>Ler 10 minutos</label><em>15 pts</em></label></div><div class="toggle" onclick="t('s')">2 tarefas - toque para abrir <span>⌄</span></div></div><div class="days"><button>Seg</button><button>Ter</button><button>Qua</button><button class="active">Qui</button><button>Sex</button><button>Sáb</button><button>Dom</button></div><div class="backup"><b>📦 Backup da Semana</b><p>Mande o código pra mamãe.</p><button class="finish" onclick="alert('Dia finalizado! 🎉')">📦 Finalizar Dia</button></div></div><div class="fab" id="f"><div class="fab-menu"><button class="c-purple">+ Filho(a)</button><button class="c-green">+ Tarefa</button><button class="c-orange">Valor</button><button class="c-green">Fechar Semana</button><button class="c-white">Importar Backup</button><button class="c-red">Zerar Checks</button><button class="c-white">Trocar PIN</button><button class="c-orange">🏆 Prêmios</button></div><button class="fab-main" onclick="document.getElementById('f').classList.toggle('open')">+</button></div><script>function t(i){document.getElementById(i).classList.toggle('open')}document.getElementById('d').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});document.querySelectorAll('.days button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.days button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}})</script></body></html>
