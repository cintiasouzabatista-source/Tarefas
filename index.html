<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f7fb;padding-bottom:20px}.header{background:#4f46e5;border-radius:0 0 22px 22px;padding:16px;color:#fff;position:relative}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.header small{opacity:.85}.header h1{font-size:22px;line-height:1.1}.date{display:inline-block;background:#fff;color:#4f46e5;padding:7px 10px;border-radius:99px;font-weight:700;font-size:13px;margin-top:8px}.mode{display:flex;background:rgba(255,255,255,.25);border-radius:99px;padding:3px}.mode button{border:0;padding:7px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer;background:transparent;color:#fff}.mode button.active{background:#fff;color:#4f46e5}.right{display:flex;gap:8px;align-items:center;position:relative}.dots{width:38px;height:38px;border-radius:50%;border:0;background:#fff;font-size:20px;font-weight:800;cursor:pointer;color:#4f46e5;line-height:1}.menu{display:none;position:absolute;right:0;top:48px;width:200px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;flex-direction:column;gap:8px}.menu.open{display:flex}.menu button{border:0;padding:11px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer;text-align:left}.c-purple{background:#4f46e5;color:#fff}.c-green{background:#22c55e;color:#fff}.c-orange{background:#f59e0b;color:#fff}.c-white{background:#fff;color:#111;border:1px solid #ddd!important}.c-red{background:#ef4444;color:#fff}.wrap{padding:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;overflow:hidden;margin-bottom:12px}.card-top{padding:14px;display:flex;justify-content:space-between;cursor:pointer}.who{display:flex;gap:10px;align-items:center}.avatar{font-size:34px}.who b{font-size:19px;color:#111827}.who span{font-size:13px;color:#9ca3af}.money{text-align:right}.money b{color:#059669;font-size:19px}.money span{font-size:13px;color:#9ca3af;display:block}.week{display:flex;justify-content:space-between;padding:0 14px 10px;font-size:13px;color:#6b7280}.bar{height:8px;background:#eef2f7;border-radius:99px;margin:0 14px 12px;overflow:hidden}.bar i{display:block;height:100%;background:#4f46e5;width:0}.tasks{display:none;padding:0 14px 12px}.card.open .tasks{display:block}.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #eee}.task input{width:22px;height:22px;accent-color:#22c55e}.task.done label{text-decoration:line-through;color:#9ca3af}.task em{margin-left:auto;font-style:normal;font-weight:700;font-size:13px;color:#059669}.toggle{background:#eef0f3;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;color:#6b7280;font-size:14px;cursor:pointer}.toggle span{width:28px;height:28px;background:#fff;border-radius:50%;display:grid;place-items:center;border:1px solid #ddd}.days{background:#fff;border:1px solid #e5e7eb;border-radius:99px;display:flex;padding:6px;margin:10px 0 16px}.days button{flex:1;border:0;background:transparent;padding:11px 0;border-radius:14px;font-weight:600;color:#6b7280;cursor:pointer}.days button.active{background:#4f46e5;color:#fff}.backup{background:#fffbe6;border:1px solid #fde68a;border-radius:22px;padding:16px}.backup b{color:#78350f;font-size:17px}.backup p{color:#78350f;font-size:14px;margin:10px 0 14px}.finish{width:100%;border:0;background:#f59e0b;color:#fff;font-weight:800;font-size:17px;padding:15px;border-radius:15px;cursor:pointer}body.filhos .only-pais,body.filhos .edit{display:none!important}body.filhos .dots{display:none}</style></head><body><div class="header"><div class="top"><div><small>Minhas Tarefas</small><h1>Tarefas da Semana</h1><span class="date" id="d"></span></div><div class="right"><div class="mode"><button id="bPais" class="active" onclick="setMode('pais')">Pais</button><button id="bFilhos" onclick="setMode('filhos')">Filhos</button></div><button class="dots only-pais" onclick="document.getElementById('menu').classList.toggle('open');event.stopPropagation()">⋮</button><div class="menu" id="menu"><button class="c-purple" onclick="alert('+ Filho')">+ Filho(a)</button><button class="c-green" onclick="alert('+ Tarefa')">+ Tarefa</button><button class="c-orange" onclick="alert('Valor')">💰 Valor</button><button class="c-green" onclick="alert('Fechar Semana')">Fechar Semana</button><button class="c-white" onclick="alert('Importar Backup')">Importar Backup</button><button class="c-red" onclick="alert('Zerar Checks')">Zerar Checks</button><button class="c-white" onclick="alert('Trocar PIN')">Trocar PIN</button><button class="c-orange" onclick="alert('Prêmios')">🏆 Prêmios</button></div></div></div></div><div class="wrap"><div class="card" id="r"><div class="card-top" onclick="t('r')"><div class="who"><div class="avatar">🐋</div><div><b>Rafaella <span class="edit">✏️🗑️🔄</span></b><br><span>0 XP</span></div></div><div class="money"><b>R$ 0,00</b><span>0 pt(s)</span></div></div><div class="week"><span>Semana</span><b>0/0 (0%)</b></div><div class="bar"><i></i></div><div class="tasks"><label class="task"><input type="checkbox" checked onchange="this.parentElement.classList.toggle('done')"><label>Arrumar a cama</label><em>10 pts</em></label><label class="task"><input type="checkbox" onchange="this.parentElement.classList.toggle('done')"><label>Escovar os dentes</label><em>10 pts</em></label></div><div class="toggle" onclick="t('r')">2 tarefas - toque para abrir <span>⌄</span></div></div><div class="card" id="s"><div class="card-top" onclick="t('s')"><div class="who"><div class="avatar">🦋</div><div><b>Sophya <span class="edit">✏️🗑️🔄</span></b><br><span>0 XP</span></div></div><div class="money"><b>R$ 0,00</b><span>0 pt(s)</span></div></div><div class="week"><span>Semana</span><b>0/0 (0%)</b></div><div class="bar"><i></i></div><div class="tasks"><label class="task"><input type="checkbox" checked onchange="this.parentElement.classList.toggle('done')"><label>Guardar os brinquedos</label><em>10 pts</em></label><label class="task"><input type="checkbox" onchange="this.parentElement.classList.toggle('done')"><label>Ler 10 minutos</label><em>15 pts</em></label></div><div class="toggle" onclick="t('s')">2 tarefas - toque para abrir <span>⌄</span></div></div><div class="days"><button>Seg</button><button>Ter</button><button>Qua</button><button class="active">Qui</button><button>Sex</button><button>Sáb</button><button>Dom</button></div><div class="backup only-pais"><b>📦 Backup da Semana</b><p>Mande o código pra mamãe.</p><button class="finish" onclick="alert('Dia finalizado! 🎉')">📦 Finalizar Dia</button></div><div class="only-pais" style="height:10px"></div></div><script>function t(i){document.getElementById(i).classList.toggle('open')}function setMode(m){if(m==='filhos'){document.body.classList.add('filhos');document.getElementById('bFilhos').classList.add('active');document.getElementById('bPais').classList.remove('active')}else{var pin=prompt('Digite o PIN de Pais');if(pin===null)return;if(pin===''||pin==='1234'){document.body.classList.remove('filhos');document.getElementById('bPais').classList.add('active');document.getElementById('bFilhos').classList.remove('active')}else{alert('PIN incorreto')}}document.getElementById('menu').classList.remove('open')}document.getElementById('d').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});document.querySelectorAll('.days button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.days button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}});document.addEventListener('click',e=>{if(!e.target.closest('.right'))document.getElementById('menu').classList.remove('open')})</script></body></html>
