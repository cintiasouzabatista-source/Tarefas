<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas das Meninas</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f7fb;color:#111;padding-bottom:90px}.header{background:linear-gradient(135deg,#4f46e5,#6366f1);padding:20px;color:#fff;border-radius:0 0 26px 26px}.header h1{font-size:22px}.date{display:inline-block;background:#fff;color:#4f46e5;padding:6px 12px;border-radius:99px;font-weight:700;font-size:13px;margin-top:10px}.wrap{padding:14px;max-width:520px;margin:auto}.card{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:.15s}.card.dropAlvo{outline:3px dashed #22c55e;outline-offset:-3px;background:#f0fdf4}.card-top{display:flex;justify-content:space-between;align-items:center}.card-top b{font-size:19px}.barra{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}.barra div{height:100%;background:#4f46e5}.task{display:flex;gap:8px;align-items:center;padding:12px 0;border-top:1px solid #eee;cursor:grab;touch-action:none}.task:active{cursor:grabbing}.task.arrastando{opacity:.4;background:#eef2ff}.task .drag{font-size:16px;color:#999;cursor:grab}.task input{width:22px;height:22px;accent-color:#4f46e5;flex-shrink:0}.task span{flex:1}.task small{color:#888}.empty{text-align:center;color:#999;padding:14px}.hint{font-size:12px;color:#888;text-align:center;margin:6px 0}.week{display:flex;gap:6px;background:#fff;padding:6px;border-radius:16px;margin:12px 0}.week button{border:0;padding:10px;border-radius:12px;flex:1;background:transparent;cursor:pointer}.week button.active{background:#4f46e5;color:#fff}.fab{position:fixed;right:16px;bottom:20px;z-index:90;text-align:right}.fab-menu{display:none;flex-direction:column;gap:8px;margin-bottom:10px;align-items:flex-end}.fab.open .fab-menu{display:flex}.fab-menu button{border:0;padding:12px 16px;border-radius:99px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap}.fab-main{width:56px;height:56px;border-radius:50%;background:#4f46e5;color:#fff;font-size:30px;border:0;cursor:pointer;box-shadow:0 4px 14px rgba(79,70,229,.4)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px}.box button{padding:12px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.chip{border:2px solid #ddd;background:#fff;padding:10px 0;border-radius:12px;cursor:pointer;font-weight:800;flex:1;text-align:center}.chip.on{background:#4f46e5;color:#fff;border-color:#4f46e5}.filhaCheck{display:flex;gap:10px;align-items:center;background:#f3f4f6;padding:12px;border-radius:14px;margin:6px 0;font-weight:700}.filhaCheck.on{background:#dcfce7;border:2px solid #22c55e}.filhaCheck input{width:22px;height:22px;accent-color:#22c55e}.toast{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:300;max-width:90%;text-align:center}.toast.show{display:block}.whoBtn{width:100%;padding:16px;margin:6px 0;border:0;border-radius:16px;background:#4f46e5;color:#fff;font-size:18px;font-weight:700;cursor:pointer}.syncBox{background:#fff8dc;border:1px solid #fde68a;border-radius:16px;padding:14px;text-align:center;margin-top:12px}.syncBox button{width:100%;padding:13px;border:0;border-radius:12px;background:#25D366;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.codigoBox{background:#fff;border:1px dashed #999;padding:12px;border-radius:10px;font-size:20px;font-weight:800;letter-spacing:3px;text-align:center;margin:10px 0}.gerRow{display:flex;gap:8px;align-items:center;background:#f9fafb;padding:12px;border-radius:14px;margin:8px 0}.gerRow b{flex:1}.presetCat{font-weight:800;font-size:13px;margin:12px 0 6px;color:#4f46e5}.presetGrid{display:flex;flex-wrap:wrap;gap:6px}.presetBtn{border:1px solid #e5e7eb;background:#f9fafb;padding:9px 10px;border-radius:99px;font-size:13px;cursor:pointer;font-weight:600;display:flex;gap:4px;align-items:center}.presetBtn.sel{background:#4f46e5;color:#fff;border-color:#4f46e5}.catFilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:6px 0}.catFilter button{border:1px solid #ddd;background:#fff;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}.catFilter button.on{background:#111;color:#fff}</style></head><body>

<div class="modal" id="modalFilha"><div class="box"><h2 id="titFilha">+ Filha</h2><label>Nome</label><input id="inNomeFilha" placeholder="Ex: Rafa"><div style="display:flex;gap:8px"><button style="background:#eee;flex:1" class="fechar">Cancelar</button><button style="background:#4f46e5;color:#fff;flex:1" id="saveFilha">Salvar</button></div></div></div>
<div class="modal" id="modalGerenciar"><div class="box"><h2>👧 Gerenciar Filhas</h2><p style="color:#666;font-size:14px;margin:8px 0">Só você vê isso aqui.</p><div id="listaGerenciar"></div><button style="background:#4f46e5;color:#fff;width:100%;margin-top:10px" id="btnAddGerenciar">+ Cadastrar outra filha</button><button style="background:#eee;width:100%;margin-top:6px" class="fechar">Fechar</button></div></div>
<div class="modal" id="modalLink"><div class="box"><h2>📤 Link pras Filhas</h2><p style="color:#666;margin:10px 0">Manda esse link pras duas, elas escolhem quem são.</p><input id="linkCopia" readonly><button style="background:#4f46e5;color:#fff;width:100%;margin-top:6px" id="btnCopiarLink">📋 Copiar link</button><button style="background:#25D366;color:#fff;width:100%;margin-top:6px" id="btnZapLink">💬 Mandar no WhatsApp</button><button style="background:#eee;width:100%;margin-top:8px" class="fechar">Fechar</button></div></div>
<div class="modal" id="modalCodigo"><div class="box"><h2 id="titCodigo">Código</h2><p id="txtCodigo" style="color:#666;margin:8px 0"></p><div class="codigoBox" id="codigoGerado"></div><input id="inCodigo" placeholder="Cole o código aqui" style="text-transform:uppercase;text-align:center;font-weight:800;letter-spacing:2px"><button style="background:#25D366;color:#fff;width:100%" id="btnZapCodigo">💬 Mandar no WhatsApp</button><button style="background:#4f46e5;color:#fff;width:100%;margin-top:6px" id="btnImportarCodigo">📥 Importar esse código</button><button style="background:#eee;width:100%;margin-top:8px" class="fechar">Fechar</button></div></div>
<script>

try{dados=JSON.parse(localStorage.getItem('dadosClean')||'null')}catch(e){dados=null}
if(!dados||!dados.filhas){dados={filhas:[],dia:'Seg'};salvar()}

];
var filtroCat='all', buscaPreset='';
function renderPreset(){var wrap=document.getElementById('listaPreset');wrap.innerHTML='';var filtrados=PRESET.filter(function(p){var okCat=filtroCat==='all'||p.idade===filtroCat||p.cat===filtroCat;var okBusca=!buscaPreset||p.nome.toLowerCase().indexOf(buscaPreset)>=0||p.icon.indexOf(buscaPreset)>=0;return okCat&&okBusca});if(!filtrados.length){wrap.innerHTML='<p style="color:#888;font-size:13px">Nenhuma encontrada. Digita a sua abaixo 👇</p>';return}var grupos={};filtrados.forEach(function(p){if(!grupos[p.idade])grupos[p.idade]=[];grupos[p.idade].push(p)});Object.keys(grupos).forEach(function(idade){var tit=document.createElement('div');tit.className='presetCat';tit.textContent=idade==='0-5'?'🧒 0 a 5 anos':idade==='6-9'?'👧 6 a 9 anos':idade==='10-13'?'👩 10 a 13 anos':'💁‍♀️ 14 a 18 anos';wrap.appendChild(tit);var grid=document.createElement('div');grid.className='presetGrid';grupos[idade].forEach(function(p){var b=document.createElement('button');b.className='presetBtn';b.innerHTML='<span>'+p.icon+'</span> '+p.nome+' <b>'+p.pts+' pts</b>';b.onclick=function(){document.getElementById('inNomeTarefa').value=p.nome;document.getElementById('inPts').value=p.pts;document.querySelectorAll('.presetBtn').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');document.getElementById('inNomeTarefa').scrollIntoView({behavior:'smooth',block:'center'})};grid.appendChild(b)});wrap.appendChild(grid)})}
var diasSemana=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function diaHoje(){return diasSemana[new Date().getDay()]}
function syncDia(){var hoje=new Date();var chave=hoje.getFullYear()+'-'+(hoje.getMonth()+1)+'-'+hoje.getDate();if(localStorage.getItem('ultimoDiaClean')!==chave){dados.dia=diaHoje();localStorage.setItem('ultimoDiaClean',chave);salvar()}}
syncDia();
function salvar(){try{localStorage.setItem('dadosClean',JSON.stringify(dados))}catch(e){}}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},2600)}
function fecharModais(){document.querySelectorAll('.modal').forEach(function(m){m.classList.remove('open')})}
function abrirModal(id){document.getElementById('fab').classList.remove('open');document.getElementById(id).classList.add('open')}
function gerarCodigo(){return dados.filhas.map(function(f){var letra=f.nome.charAt(0).toUpperCase();var bits=f.tarefas.map(function(t){return t.feito?'1':'0'}).join('')||'0';return letra+bits}).join('-')}
function importarCodigo(cod){cod=(cod||'').toUpperCase().trim().replace(/[^A-Z0-9\-]/g,'');var partes=cod.split('-');var ok=false;partes.forEach(function(p){if(p.length<2)return;var letra=p.charAt(0);var bits=p.slice(1);var f=dados.filhas.find(function(x){return x.nome.charAt(0).toUpperCase()===letra});if(f){for(var i=0;i<Math.min(bits.length,f.tarefas.length);i++){f.tarefas[i].feito=bits[i]==='1'}ok=true}});return ok}
var editFilhaIdx=-1;
function abrirGerenciar(){var wrap=document.getElementById('listaGerenciar');wrap.innerHTML='';if(!dados.filhas.length){wrap.innerHTML='<p style="text-align:center;color:#888;padding:10px">Nenhuma filha cadastrada ainda.</p>'}dados.filhas.forEach(function(f,idx){var row=document.createElement('div');row.className='gerRow';var b=document.createElement('b');b.textContent=f.nome;row.appendChild(b);var edit=document.createElement('button');edit.textContent='✏️ Editar';edit.style.cssText='border:0;background:#e0e7ff;padding:8px 10px;border-radius:99px;font-weight:800;cursor:pointer';edit.onclick=function(){fecharModais();editFilhaIdx=idx;document.getElementById('titFilha').textContent='Editar Filha';document.getElementById('inNomeFilha').value=f.nome;abrirModal('modalFilha')};row.appendChild(edit);var del=document.createElement('button');del.textContent='🗑️';del.style.cssText='border:0;background:#fee2e2;padding:8px 10px;border-radius:99px;font-weight:800;cursor:pointer';del.onclick=function(){if(confirm('Excluir '+f.nome+' e as tarefas dela?')){dados.filhas.splice(idx,1);salvar();abrirGerenciar();render()}};row.appendChild(del);wrap.appendChild(row)});abrirModal('modalGerenciar')}
function abrirNovaTarefa(){if(!dados.filhas.length){toast('Cadastra uma filha primeiro no + !');return}document.getElementById('inNomeTarefa').value='';document.getElementById('inPts').value='';document.getElementById('buscaTarefa').value='';buscaPreset='';filtroCat='all';document.querySelectorAll('#catFilter button').forEach(function(b){b.classList.toggle('on',b.dataset.cat==='all')});renderPreset();var wrap=document.getElementById('listaFilhasCheck');wrap.innerHTML='';dados.filhas.forEach(function(f,i){var lab=document.createElement('label');lab.className='filhaCheck on';var chk=document.createElement('input');chk.type='checkbox';chk.checked=true;chk.setAttribute('data-idx',i);chk.addEventListener('change',function(){lab.classList.toggle('on',chk.checked)});lab.appendChild(chk);var sp=document.createElement('span');sp.textContent=f.nome;lab.appendChild(sp);wrap.appendChild(lab)});document.querySelectorAll('#diasNova .chip').forEach(function(c){c.classList.toggle('on',c.dataset.dia===dados.dia)});abrirModal('modalTarefa')}
var arrastando=null;
function transferirTarefa(filhaOrigemIdx, tarefa, filhaDestinoIdx){if(filhaOrigemIdx===filhaDestinoIdx)return;var origem=dados.filhas[filhaOrigemIdx];var destino=dados.filhas[filhaDestinoIdx];if(!origem||!destino)return;var idx=origem.tarefas.indexOf(tarefa);if(idx===-1)return;var ja=destino.tarefas.some(function(t){return t.nome===tarefa.nome&&t.dia===tarefa.dia});if(ja){toast('Ela já tem essa tarefa!');return}origem.tarefas.splice(idx,1);destino.tarefas.push(tarefa);salvar();render();toast('➡️ Transferido pra '+destino.nome+'!')}
function render(){var lista=document.getElementById('lista');lista.innerHTML='';var isFilhos=document.body.classList.contains('filhos')||MODO_FILHOS_URL;document.getElementById('dataTopo').textContent=dados.dia+', '+new Date().getDate()+' de Nov';if(isFilhos&&MODO_FILHOS_URL&&!filhaLogada){if(!dados.filhas.length){var aviso=document.createElement('p');aviso.style.cssText='text-align:center;color:#888;padding:20px';aviso.textContent='Nenhuma filha cadastrada ainda. Pede pra mamãe cadastrar você! 💜';lista.appendChild(aviso);return}var h=document.createElement('h2');h.style.textAlign='center';h.textContent='Olá! Quem é você? 💜';lista.appendChild(h);dados.filhas.forEach(function(f){var b=document.createElement('button');b.className='whoBtn';b.textContent=f.nome;b.onclick=function(){filhaLogada=f.nome;localStorage.setItem('filhaLogada',f.nome);render()};lista.appendChild(b)});return}var mostrar=dados.filhas;if(isFilhos&&MODO_FILHOS_URL&&filhaLogada){mostrar=dados.filhas.filter(function(f){return f.nome===filhaLogada})}if(!mostrar.length&&!isFilhos){var vazio=document.createElement('div');vazio.className='card';vazio.innerHTML='<p style="text-align:center;padding:10px">Nenhuma filha cadastrada ainda.<br>Clica no <b>+</b> lá embaixo pra cadastrar.</p>';lista.appendChild(vazio)}if(!isFilhos&&dados.filhas.length>1){var hint=document.createElement('p');hint.className='hint';hint.textContent='↕️ Segura na tarefa e arrasta pro card da outra filha pra transferir';lista.appendChild(hint)}mostrar.forEach(function(f){var filhaIdx=dados.filhas.indexOf(f);var hoje=f.tarefas.filter(function(t){return t.dia===dados.dia});var feitos=hoje.filter(function(t){return t.feito}).length;var pts=0;f.tarefas.forEach(function(t){if(t.feito)pts+=Number(t.pts||0)});var card=document.createElement('div');card.className='card';card.setAttribute('data-filha-idx',filhaIdx);var top=document.createElement('div');top.className='card-top';top.innerHTML='<b>'+f.nome+'</b><span><b>'+pts+' pts</b> • '+feitos+'/'+hoje.length+' hoje</span>';var barra=document.createElement('div');barra.className='barra';barra.innerHTML='<div style="width:'+(hoje.length?Math.round(feitos/hoje.length*100):0)+'%"></div>';card.appendChild(top);card.appendChild(barra);if(!hoje.length){var e=document.createElement('div');e.className='empty';e.textContent='Nenhuma tarefa hoje 🎉';card.appendChild(e)}hoje.forEach(function(t){var row=document.createElement('div');row.className='task';if(!isFilhos){row.draggable=true;row.addEventListener('dragstart',function(ev){arrastando={filhaIdx:filhaIdx,tarefa:t};row.classList.add('arrastando');try{ev.dataTransfer.setData('text/plain','x')}catch(e){}});row.addEventListener('dragend',function(){arrastando=null;row.classList.remove('arrastando');document.querySelectorAll('.card').forEach(function(c){c.classList.remove('dropAlvo')})});var startY=0,startX=0,moved=false;row.addEventListener('touchstart',function(ev){if(ev.touches.length!==1)return;startX=ev.touches[0].clientX;startY=ev.touches[0].clientY;moved=false},{passive:true});row.addEventListener('touchmove',function(ev){if(!ev.touches.length)return;var dx=Math.abs(ev.touches[0].clientX-startX);var dy=Math.abs(ev.touches[0].clientY-startY);if(dy>25||dx>25)moved=true;if(moved){var el=document.elementFromPoint(ev.touches[0].clientX,ev.touches[0].clientY);var c=el?el.closest('.card'):null;document.querySelectorAll('.card').forEach(function(cc){cc.classList.remove('dropAlvo')});if(c)c.classList.add('dropAlvo')}},{passive:true});row.addEventListener('touchend',function(ev){if(!moved)return;var touch=ev.changedTouches[0];var el=document.elementFromPoint(touch.clientX,touch.clientY);var c=el?el.closest('.card'):null;document.querySelectorAll('.card').forEach(function(cc){cc.classList.remove('dropAlvo')});if(c){var destIdx=parseInt(c.getAttribute('data-filha-idx'));var real=dados.filhas[filhaIdx].tarefas.find(function(x){return x.nome===t.nome&&x.dia===t.dia})||t;transferirTarefa(filhaIdx,real,destIdx)}},false)}var dragIcon=document.createElement('span');dragIcon.className='drag';dragIcon.textContent=isFilhos?'':'⋮⋮';row.appendChild(dragIcon);var chk=document.createElement('input');chk.type='checkbox';chk.checked=t.feito;chk.onchange=function(){t.feito=chk.checked;salvar();render()};chk.addEventListener('click',function(ev){ev.stopPropagation()});var sp=document.createElement('span');sp.textContent=t.nome;var sm=document.createElement('small');sm.textContent=(t.pts||0)+' pts';row.appendChild(chk);row.appendChild(sp);row.appendChild(sm);if(!isFilhos){var del=document.createElement('button');del.textContent='🗑️';del.style.cssText='border:0;background:transparent;cursor:pointer;font-size:16px';del.onclick=function(e){e.preventDefault();e.stopPropagation();if(confirm('Excluir "'+t.nome+'"?')){f.tarefas.splice(f.tarefas.indexOf(t),1);salvar();render()}};row.appendChild(del)}card.appendChild(row)});if(!isFilhos){card.addEventListener('dragover',function(ev){ev.preventDefault();card.classList.add('dropAlvo')});card.addEventListener('dragleave',function(){card.classList.remove('dropAlvo')});card.addEventListener('drop',function(ev){ev.preventDefault();card.classList.remove('dropAlvo');if(!arrastando)return;var destIdx=parseInt(card.getAttribute('data-filha-idx'));transferirTarefa(arrastando.filhaIdx,arrastando.tarefa,destIdx);arrastando=null})}lista.appendChild(card)});var week=document.createElement('div');week.className='week';['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(function(d){var b=document.createElement('button');b.textContent=d;if(d===dados.dia)b.classList.add('active');b.onclick=function(){dados.dia=d;salvar();render()};week.appendChild(b)});lista.appendChild(week);if(isFilhos){var sync=document.createElement('div');sync.className='syncBox';sync.innerHTML='<b>✅ Terminou?</b><p>Manda o código curtinho pra mamãe.</p>';var btn=document.createElement('button');btn.textContent='✅ Terminei - gerar código pra mamãe';btn.onclick=function(){var cod=gerarCodigo();document.getElementById('titCodigo').textContent='Seu código pra mamãe';document.getElementById('txtCodigo').textContent='Copia esse código e manda pra mamãe no WhatsApp.';document.getElementById('codigoGerado').textContent=cod;document.getElementById('inCodigo').value=cod;window._codigoAtual=cod;abrirModal('modalCodigo')};sync.appendChild(btn);lista.appendChild(sync)}}
function irPais(){document.body.classList.remove('filhos');document.getElementById('titulo').textContent='Tarefas das Meninas';document.getElementById('subTitulo').textContent='Olá! Seja Bem Vindo!';document.getElementById('fab').style.display='block';render()}
function irFilhos(){document.body.classList.add('filhos');document.getElementById('titulo').textContent='Minhas Tarefas';document.getElementById('subTitulo').textContent='Olá!';document.getElementById('fab').style.display='none';render()}
document.getElementById('btnFab').onclick=function(e){e.stopPropagation();document.getElementById('fab').classList.toggle('open')};
document.getElementById('btnNovaTarefaFab').onclick=function(){abrirNovaTarefa()};
document.getElementById('btnFilhaFab').onclick=function(){editFilhaIdx=-1;document.getElementById('titFilha').textContent='+ Filha';document.getElementById('inNomeFilha').value='';abrirModal('modalFilha')};
document.getElementById('btnGerenciarFab').onclick=function(){abrirGerenciar()};
document.getElementById('btnAddGerenciar').onclick=function(){fecharModais();editFilhaIdx=-1;document.getElementById('titFilha').textContent='+ Filha';document.getElementById('inNomeFilha').value='';abrirModal('modalFilha')};
document.getElementById('btnCompartilharFab').onclick=function(){var link=location.href.split('?')[0]+'?filhos';document.getElementById('linkCopia').value=link;abrirModal('modalLink')};
document.getElementById('btnCopiarLink').onclick=function(){var i=document.getElementById('linkCopia');i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')};toast('Link copiado!')};
document.getElementById('btnZapLink').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent('Oi filhas! 💜 Abre aqui suas tarefas: '+document.getElementById('linkCopia').value),'_blank')};
document.getElementById('btnImportarFab').onclick=function(){document.getElementById('titCodigo').textContent='Importar atualização';document.getElementById('txtCodigo').textContent='Cole o código que sua filha te mandou.';document.getElementById('codigoGerado').textContent='Cole abaixo';document.getElementById('inCodigo').value='';abrirModal('modalCodigo')};
document.getElementById('btnVerFilhosFab').onclick=function(){irFilhos()};
document.getElementById('btnZapCodigo').onclick=function(){var cod=document.getElementById('inCodigo').value||window._codigoAtual||'';window.open('https://wa.me/?text='+encodeURIComponent('Mamãe, terminei! 💜 Meu código é: '+cod),'_blank')};
document.getElementById('btnImportarCodigo').onclick=function(){var cod=document.getElementById('inCodigo').value;if(importarCodigo(cod)){salvar();fecharModais();render();toast('✅ Atualizado com o que ela fez!')}else{toast('Código inválido.')}};
document.getElementById('buscaTarefa').addEventListener('input',function(){buscaPreset=this.value.toLowerCase().trim();renderPreset()});
document.querySelectorAll('#catFilter button').forEach(function(b){b.onclick=function(){filtroCat=b.dataset.cat;document.querySelectorAll('#catFilter button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');renderPreset()}});
document.querySelectorAll('#diasNova .chip').forEach(function(c){c.onclick=function(){c.classList.toggle('on')}});
document.getElementById('saveTarefa').onclick=function(){var nome=document.getElementById('inNomeTarefa').value.trim();if(!nome){toast('Clica numa tarefa pronta ou digita uma');return}var pts=document.getElementById('inPts').value.trim();var idxs=[];document.querySelectorAll('#listaFilhasCheck input:checked').forEach(function(c){idxs.push(parseInt(c.dataset.idx))});if(!idxs.length){toast('Flega pelo menos 1 filha');return}var dias=[];document.querySelectorAll('#diasNova .chip.on').forEach(function(c){dias.push(c.dataset.dia)});if(!dias.length){toast('Flega pelo menos 1 dia');return}idxs.forEach(function(fi){dias.forEach(function(d){var f=dados.filhas[fi];if(!f.tarefas.some(function(t){return t.nome===nome&&t.dia===d})){f.tarefas.push({nome:nome,pts:pts,dia:d,feito:false})}})});salvar();fecharModais();render();toast('✅ Criado!')};
document.getElementById('saveFilha').onclick=function(){var n=document.getElementById('inNomeFilha').value.trim();if(!n)return;if(editFilhaIdx>=0){dados.filhas[editFilhaIdx].nome=n}else{dados.filhas.push({nome:n,tarefas:[]})}salvar();fecharModais();editFilhaIdx=-1;render()};
document.querySelectorAll('.fechar').forEach(function(b){b.onclick=function(){fecharModais();editFilhaIdx=-1}});
document.querySelectorAll('.modal').forEach(function(m){m.onclick=function(e){if(e.target===m){fecharModais();editFilhaIdx=-1}}});
document.addEventListener('click',function(e){if(!e.target.closest('.fab'))document.getElementById('fab').classList.remove('open')});
if(MODO_FILHOS_URL){irFilhos()}else{irPais()}
</script></body></html>
