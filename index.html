<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Tarefas</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f7fb}.header{background:#4f46e5;padding:16px;color:#fff;border-radius:0 0 22px 22px}.top{display:flex;justify-content:space-between;gap:8px}.date{display:inline-block;background:#fff;color:#4f46e5;padding:7px 12px;border-radius:99px;font-weight:700;font-size:13px;margin-top:8px}.mode{display:flex;background:rgba(255,255,255,.25);border-radius:99px;padding:3px}.mode button{border:0;padding:7px 12px;border-radius:99px;font-weight:700;cursor:pointer;background:transparent;color:#fff}.mode button.active{background:#fff;color:#4f46e5}.dots{width:38px;height:38px;border-radius:50%;border:0;background:#fff;font-size:20px;cursor:pointer}.right{position:relative;display:flex;gap:8px;align-items:center}.menu3{display:none;position:absolute;right:0;top:48px;width:220px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;flex-direction:column;gap:8px}.menu3.open{display:flex}.menu3 button{border:0;padding:11px;border-radius:99px;font-weight:700;cursor:pointer;text-align:left}.wrap{padding:14px;max-width:520px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;margin-bottom:12px;overflow:hidden}.card-top{padding:14px;display:flex;justify-content:space-between;cursor:pointer}.tasks{display:none;padding:0 14px 12px}.card.open .tasks{display:block}.task{display:flex;gap:10px;padding:12px 0;border-top:1px solid #eee;align-items:center}.task input{width:22px;height:22px;accent-color:#4f46e5}.week{display:flex;gap:6px;background:#fff;padding:6px;border-radius:16px;justify-content:space-between;margin:12px 0}.week button{border:0;padding:10px 12px;border-radius:12px;cursor:pointer;background:transparent;flex:1}.week button.active{background:#4f46e5;color:#fff}.backup{background:#fff8dc;border:1px solid #fde68a;border-radius:16px;padding:14px;text-align:center}.fin{width:100%;padding:13px;border:0;border-radius:12px;background:#f59e0b;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.fab{position:fixed;right:16px;bottom:20px;z-index:90;text-align:right}.fab-menu{display:none;flex-direction:column;gap:8px;margin-bottom:10px;align-items:flex-end}.fab.open .fab-menu{display:flex}.fab-menu button{border:0;padding:11px 16px;border-radius:99px;font-weight:700;cursor:pointer}.fab-main{width:56px;height:56px;border-radius:50%;background:#4f46e5;color:#fff;font-size:30px;border:0;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:430px;max-height:90vh;overflow:auto}.box input,.box select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px;font-size:16px}.box button{padding:13px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.toast{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 14px;border-radius:99px;font-size:13px;z-index:300;gap:8px;align-items:center;max-width:92%}.toast.show{display:flex}.toast button{border:0;background:#22c55e;color:#fff;padding:5px 10px;border-radius:99px;font-weight:700;cursor:pointer}.toast .x{background:transparent}.iconBtn{border:0;background:transparent;cursor:pointer;font-size:13px;padding:2px 3px;opacity:.6}.switch{display:flex;justify-content:space-between;align-items:center;background:#eef2ff;padding:12px;border-radius:12px;margin:6px 0 12px;font-size:14px;font-weight:600}.switch input{width:44px;height:24px;accent-color:#4f46e5}body.filhos .only-pais{display:none!important}body.filhos .tasks{display:block!important}body.filhos .week,body.filhos .backup{display:none!important}.linkPais{display:block;text-align:center;margin:16px 0;color:#4f46e5;font-weight:700;cursor:pointer;background:none;border:0;width:100%}.incentivo{background:#ede9fe;padding:8px 10px;border-radius:99px;font-size:13px;font-weight:700;margin:8px 0}.barra{height:8px;background:#ddd;border-radius:99px;overflow:hidden}.barra div{height:100%;background:#4f46e5}</style></head><body>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastX" class="x" type="button">✕</button></div>
<div class="header"><div class="top"><div><small id="subTitulo">Minhas Tarefas</small><h1 id="tituloPrincipal" style="font-size:22px">Tarefas da Semana</h1><span class="date">Qui, 19 de Nov</span></div><div class="right"><div class="mode"><button id="bPais" class="active" type="button">Pais</button><button id="bFilhos" type="button">Filhos</button></div><button class="dots only-pais" id="btnDots" type="button">⋮</button><div class="menu3" id="menu3"><button style="background:#f59e0b;color:#fff" id="mValor" type="button">Valor por ponto</button><button style="background:#22c55e;color:#fff" id="mFechar" type="button">Fechar Semana</button><button style="background:#fff;border:1px solid #ddd" id="mBackup" type="button">Importar Backup</button><button style="background:#ef4444;color:#fff" id="mZerar" type="button">Zerar Checks</button><button style="background:#fff;border:1px solid #ddd" id="mPin" type="button">Cadastrar / Trocar PIN</button><button style="background:#f59e0b;color:#fff" id="mPremio" type="button">Premios</button></div></div></div></div>
<div class="wrap" id="lista"></div>
<div class="fab only-pais" id="fab"><div class="fab-menu"><button style="background:#4f46e5;color:#fff" id="btnFilho" type="button">+ Filha</button><button style="background:#22c55e;color:#fff" id="btnTarefa" type="button">+ Tarefa</button></div><button class="fab-main" id="btnFab" type="button">+</button></div>
<div class="modal" id="modalFilho"><div class="box"><h2>+ Cadastrar Filha</h2><label>Nome</label><input id="inNome" placeholder="Nome da sua filha"><label>Chave PIX dela</label><input id="inPixFilha" placeholder="E-mail, telefone ou CPF"><div style="display:flex;gap:8px"><button style="background:#eee;flex:1" class="fechar" type="button">Cancelar</button><button style="background:#4f46e5;color:#fff;flex:1" id="saveFilho" type="button">Salvar</button></div></div></div>
<div class="modal" id="modalTarefa"><div class="box"><h2>+ Cadastrar Tarefa</h2><label>Nome da tarefa</label><input id="inTarefa" placeholder="Ex: Lavar Louça"><label>Pontos - deixe em branco se não quiser</label><input id="inPts" type="number" placeholder="Digite os pontos"><label>Valor por ponto R$ - ex: 0,50</label><input id="inValor" type="text" inputmode="decimal" placeholder="0,00"><label class="switch">Revezar entre as filhas - distribui automaticamente intercalando os dias <input type="checkbox" id="chkRevezar"></label><p style="font-size:13px;color:#666;margin:-6px 0 12px">Ligado: Seg = 1ª filha, Ter = 2ª filha, Qua = 1ª de novo...</p><label>Para quem? - se revezar ligado, ignora</label><select id="selQuem"></select><label>Dia</label><div class="week" id="diasTarefa"><button type="button">Seg</button><button type="button">Ter</button><button type="button">Qua</button><button type="button" class="active">Qui</button><button type="button">Sex</button><button type="button">Sáb</button><button type="button">Dom</button></div><div style="display:flex;gap:8px"><button style="background:#eee;flex:1" class="fechar" type="button">Cancelar</button><button style="background:#22c55e;color:#fff;flex:1" id="saveTarefa" type="button">Salvar</button></div></div></div>
<div class="modal" id="modalPin"><div class="box"><h2 style="text-align:center">🔒 PIN dos Pais</h2><p style="text-align:center;color:#666;font-size:14px;margin:8px 0">Digite seu PIN - abre sozinho</p><input id="inPin" type="password" inputmode="numeric" placeholder="Digite seu PIN" autocomplete="off"><button style="background:#4f46e5;color:#fff;width:100%" id="btnEntrarPin" type="button">Entrar</button><button class="fechar" type="button" style="background:none;color:#4f46e5;width:100%">Cancelar</button><p id="pinErro" style="color:#ef4444;text-align:center;display:none">PIN incorreto</p></div></div>
<div class="modal" id="modalCadastrarPin"><div class="box"><h2>Cadastrar PIN</h2><p style="color:#666;font-size:14px;margin:8px 0">Crie um PIN que só você sabe.</p><input id="inNovoPin" type="password" inputmode="numeric" placeholder="Ex: 1234"><div style="display:flex;gap:8px"><button style="background:#eee;flex:1" class="fechar" type="button">Cancelar</button><button style="background:#4f46e5;color:#fff;flex:1" id="savePin" type="button">Salvar PIN</button></div></div></div>
<div class="modal" id="modalSimples"><div class="box"><h2 id="titSimples">Acao</h2><p id="txtSimples" style="margin:12px 0">Feito!</p><div id="boxPixSimples" style="display:none"><input id="pixCopia" readonly><button style="background:#22c55e;color:#fff;width:100%;margin-top:6px" id="btnCopiarPix" type="button">Copiar chave PIX</button></div><button style="background:#4f46e5;color:#fff;width:100%;margin-top:10px" class="fechar" type="button">OK</button></div></div>
<script>
var PIN=localStorage.getItem('pinPais')||'';var valorPonto=localStorage.getItem('valorPonto')||'0,50';
var dados=JSON.parse(localStorage.getItem('dadosTarefas2')||'null');
if(!dados){dados={filhas:[{nome:'Rafaella',pix:'',tarefas:[]},{nome:'Sophya',pix:'',tarefas:[{nome:'Lavar Louça',pts:'1',dia:'Qui',feito:false}]}],dia:'Qui'};salvar()}
function salvar(){localStorage.setItem('dadosTarefas2',JSON.stringify(dados));localStorage.setItem('valorPonto',valorPonto)}
function valorNum(){return parseFloat(valorPonto.replace(',','.'))||0}
function fecharMenus(){document.getElementById('menu3').classList.remove('open');document.getElementById('fab').classList.remove('open')}
function fecharModais(){document.querySelectorAll('.modal').forEach(function(m){m.classList.remove('open')})}
function abrirModal(id){fecharMenus();document.getElementById(id).classList.add('open')}
function mostrarToast(t){document.getElementById('toastTxt').textContent=t;document.getElementById('toast').classList.add('show');setTimeout(function(){document.getElementById('toast').classList.remove('show')},3500)}
function render(){var lista=document.getElementById('lista');lista.innerHTML='';var isFilhos=document.body.classList.contains('filhos');dados.filhas.forEach(function(f,idx){var feitos=f.tarefas.filter(function(t){return t.feito}).length;var total=f.tarefas.length;var pts=0;f.tarefas.forEach(function(t){if(t.feito)pts+=Number(t.pts||0)});var dinheiro=pts*valorNum();var faltam=total-feitos;var card=document.createElement('div');card.className='card open';var pixBtn=f.pix?'<button class="iconBtn only-pais" data-pix="'+idx+'" type="button" title="Copiar PIX">💸 PIX</button>':'';card.innerHTML='<div class="card-top"><div><b style="font-size:18px">'+f.nome+'</b> <button class="iconBtn only-pais" type="button">✏️</button><button class="iconBtn only-pais" data-del="'+idx+'" type="button">🗑️</button>'+pixBtn+'<div style="font-size:12px;color:#666">Semana</div></div><div style="text-align:right" class="only-pais"><b style="color:#059669">R$ '+dinheiro.toFixed(2).replace('.',',')+'</b><div style="font-size:12px;color:#666">'+pts+' pt(s) • R$ '+valorPonto+' / ponto</div></div></div>'+(isFilhos?'<div class="incentivo">⭐ '+(faltam>0?'Falta '+faltam+' para ganhar R$ '+(dinheiro+valorNum()).toFixed(2).replace('.',',')+'! Continue!':'🎉 Você completou tudo! Você ganhou R$ '+dinheiro.toFixed(2).replace('.',',')+'!')+'</div><div class="barra"><div style="width:'+(total?Math.round(feitos/total*100):0)+'%"></div></div>':'')+'<div class="tasks"></div><div class="only-pais" style="background:#eef0f3;padding:11px 14px;font-size:14px;color:#666">'+total+' tarefas - toque para abrir <span style="float:right">∨</span></div>';var tasks=card.querySelector('.tasks');f.tarefas.forEach(function(t){var lab=document.createElement('label');lab.className='task';var chk=document.createElement('input');chk.type='checkbox';chk.checked=t.feito;chk.addEventListener('change',function(){t.feito=chk.checked;salvar();render()});var sp=document.createElement('span');sp.textContent=t.nome+' ('+t.dia+')';sp.style.flex='1';var b=document.createElement('b');b.textContent=(t.pts?t.pts+' pts':'')+' • R$ '+((Number(t.pts||0))*valorNum()).toFixed(2).replace('.',',');lab.appendChild(chk);lab.appendChild(sp);lab.appendChild(b);tasks.appendChild(lab)});card.querySelector('.card-top').addEventListener('click',function(e){if(e.target.closest('button'))return;if(isFilhos)return;card.classList.toggle('open')});var del=card.querySelector('[data-del]');if(del)del.addEventListener('click',function(e){e.stopPropagation();if(confirm('Excluir '+f.nome+'?')){dados.filhas.splice(idx,1);salvar();render()}});var pb=card.querySelector('[data-pix]');if(pb)pb.addEventListener('click',function(e){e.stopPropagation();document.getElementById('titSimples').textContent='PIX - '+f.nome;document.getElementById('txtSimples').textContent='Chave: '+f.pix;document.getElementById('boxPixSimples').style.display='block';document.getElementById('pixCopia').value=f.pix;abrirModal('modalSimples')});lista.appendChild(card)});var week=document.createElement('div');week.className='week only-pais';['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(function(d){var b=document.createElement('button');b.type='button';b.textContent=d;if(d===dados.dia)b.classList.add('active');b.addEventListener('click',function(){dados.dia=d;salvar();render()});week.appendChild(b)});lista.appendChild(week);var back=document.createElement('div');back.className='backup only-pais';back.innerHTML='<b>📦 Backup da Semana</b><p style="margin:8px 0">Mande o código pra mamãe. Valor por ponto: R$ '+valorPonto+'</p><button class="fin" type="button">⬇ Finalizar Dia</button>';back.querySelector('.fin').addEventListener('click',function(){document.getElementById('titSimples').textContent='Dia finalizado';document.getElementById('txtSimples').textContent='Bom trabalho hoje!';document.getElementById('boxPixSimples').style.display='none';abrirModal('modalSimples')});lista.appendChild(back);var link=document.createElement('button');link.className='linkPais';link.type='button';link.textContent='Pai / Mãe - digitar PIN';link.style.display=isFilhos?'block':'none';link.addEventListener('click',abrirPin);lista.appendChild(link);var sel=document.getElementById('selQuem');sel.innerHTML='';dados.filhas.forEach(function(f){var o=document.createElement('option');o.textContent=f.nome;sel.appendChild(o)})}
function abrirPin(){if(!PIN){abrirModal('modalCadastrarPin');return}abrirModal('modalPin');setTimeout(function(){document.getElementById('inPin').focus()},100)}
function irPais(){document.body.classList.remove('filhos');document.getElementById('bPais').classList.add('active');document.getElementById('bFilhos').classList.remove('active');document.getElementById('tituloPrincipal').textContent='Tarefas da Semana';document.getElementById('subTitulo').textContent='Minhas Tarefas';render()}
function irFilhos(){document.body.classList.add('filhos');document.getElementById('bFilhos').classList.add('active');document.getElementById('bPais').classList.remove('active');document.getElementById('tituloPrincipal').textContent='Tarefas de Hoje';document.getElementById('subTitulo').textContent='Olá!';render()}
function tentarEntrar(){var v=document.getElementById('inPin').value.trim();if(!PIN)return;if(v===PIN){fecharModais();document.getElementById('inPin').value='';document.getElementById('pinErro').style.display='none';irPais()}else if(v.length>=4){document.getElementById('pinErro').style.display='block'}}
document.getElementById('inPin').addEventListener('input',tentarEntrar);
document.getElementById('btnEntrarPin').addEventListener('click',tentarEntrar);
document.getElementById('toastX').addEventListener('click',function(){document.getElementById('toast').classList.remove('show')});
document.getElementById('btnCopiarPix').addEventListener('click',function(){var i=document.getElementById('pixCopia');i.select();document.execCommand('copy');mostrarToast('Chave PIX copiada!')});
document.getElementById('btnDots').addEventListener('click',function(e){e.stopPropagation();var m=document.getElementById('menu3');var o=m.classList.contains('open');fecharMenus();if(!o)m.classList.add('open')});
document.getElementById('btnFab').addEventListener('click',function(e){e.stopPropagation();document.getElementById('fab').classList.toggle('open')});
document.getElementById('btnFilho').addEventListener('click',function(e){e.stopPropagation();abrirModal('modalFilho')});
document.getElementById('btnTarefa').addEventListener('click',function(e){e.stopPropagation();abrirModal('modalTarefa')});
document.getElementById('mValor').addEventListener('click',function(){var v=prompt('Valor por ponto R$ (ex: 0,50)',valorPonto);if(v){valorPonto=v;salvar();render()}});
document.getElementById('mFechar').addEventListener('click',function(){document.getElementById('titSimples').textContent='Fechar Semana';document.getElementById('txtSimples').textContent='Semana fechada!';document.getElementById('boxPixSimples').style.display='none';abrirModal('modalSimples')});
document.getElementById('mBackup').addEventListener('click',function(){document.getElementById('titSimples').textContent='Importar Backup';document.getElementById('txtSimples').textContent='Cole o codigo.';document.getElementById('boxPixSimples').style.display='none';abrirModal('modalSimples')});
document.getElementById('mZerar').addEventListener('click',function(){dados.filhas.forEach(function(f){f.tarefas.forEach(function(t){t.feito=false})});salvar();render()});
document.getElementById('mPin').addEventListener('click',function(){abrirModal('modalCadastrarPin')});
document.getElementById('mPremio').addEventListener('click',function(){document.getElementById('titSimples').textContent='Premios';document.getElementById('txtSimples').textContent='Ex: 100 pts = premio';document.getElementById('boxPixSimples').style.display='none';abrirModal('modalSimples')});
document.getElementById('savePin').addEventListener('click',function(){var v=document.getElementById('inNovoPin').value.trim();if(!v)return;PIN=v;localStorage.setItem('pinPais',v);fecharModais();mostrarToast('PIN salvo!')});
document.querySelectorAll('.fechar').forEach(function(b){b.addEventListener('click',fecharModais)});
document.querySelectorAll('.modal').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)fecharModais()})});
document.getElementById('bPais').addEventListener('click',abrirPin);
document.getElementById('bFilhos').addEventListener('click',irFilhos);
document.getElementById('saveFilho').addEventListener('click',function(){var n=document.getElementById('inNome').value.trim();if(!n)return;dados.filhas.push({nome:n,pix:document.getElementById('inPixFilha').value.trim(),tarefas:[]});salvar();document.getElementById('inNome').value='';document.getElementById('inPixFilha').value='';fecharModais();render()});
document.getElementById('saveTarefa').addEventListener('click',function(){var txt=document.getElementById('inTarefa').value.trim()||'Nova tarefa';var pts=document.getElementById('inPts').value.trim();var val=document.getElementById('inValor').value.trim();if(val)valorPonto=val;var rev=document.getElementById('chkRevezar').checked;var dia0=document.querySelector('#diasTarefa button.active')?document.querySelector('#diasTarefa button.active').textContent:'Qui';var dias=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];var start=dias.indexOf(dia0);if(rev){for(var i=0;i<7;i++){var d=dias[(start+i)%7];var f=dados.filhas[i%dados.filhas.length];if(f)f.tarefas.push({nome:txt,pts:pts,dia:d,feito:false})}mostrarToast('Revezado! '+txt+' distribuída intercalando os dias!')}else{var quem=document.getElementById('selQuem').value;var f2=dados.filhas.find(function(x){return x.nome===quem});if(f2)f2.tarefas.push({nome:txt,pts:pts,dia:dia0,feito:false})}salvar();fecharModais();render();document.getElementById('inTarefa').value='';document.getElementById('inPts').value='';document.getElementById('chkRevezar').checked=false});
document.querySelectorAll('#diasTarefa button').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('#diasTarefa button').forEach(function(x){x.classList.remove('active')});btn.classList.add('active')})});
document.addEventListener('click',function(e){if(!e.target.closest('.right')&&!e.target.closest('.fab'))fecharMenus()});
render();
</script></body></html>
