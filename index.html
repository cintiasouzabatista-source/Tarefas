<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f7fb;padding-bottom:90px}.header{background:linear-gradient(135deg,#4f46e5,#6366f1);padding:20px;color:#fff;border-radius:0 0 26px 26px}.header h1{font-size:22px}.date{display:inline-block;background:#fff;color:#4f46e5;padding:6px 12px;border-radius:99px;font-weight:700;font-size:13px;margin-top:10px}.wrap{padding:14px;max-width:520px;margin:auto}.card{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);overflow:hidden}.card-top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:6px}.card-top b{font-size:20px}.seta{font-size:22px}.card.aberto .seta{transform:rotate(180deg)}.barra{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}.barra div{height:100%;background:#4f46e5}.listaTarefas{display:none}.card.aberto .listaTarefas{display:block}.task{display:flex;align-items:center;gap:10px;padding:14px 4px;border-top:1px solid #eee;cursor:pointer}.task input{flex:0 0 30px;width:30px;height:30px;accent-color:#22c55e;pointer-events:none}.task .nome{flex:1;font-size:17px;line-height:1.3}.task small{flex:0 0 62px;text-align:right;color:#16a34a;font-weight:800;font-size:12px}.task button{border:0;background:transparent;font-size:16px}.task.feita{background:#f0fdf4}.task.feita .nome{text-decoration:line-through;color:#888}.task .dataFez{font-size:11px;color:#16a34a;font-weight:700;display:block}.empty{text-align:center;color:#999;padding:14px}.hint{font-size:12px;color:#888;text-align:center;margin:6px 0}.fab{position:fixed;right:16px;bottom:20px;z-index:90;text-align:right}.fab-menu{display:none;flex-direction:column;gap:8px;margin-bottom:10px;align-items:flex-end}.fab.open .fab-menu{display:flex}.fab-menu button{border:0;padding:12px 16px;border-radius:99px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}.fab-main{width:56px;height:56px;border-radius:50%;background:#4f46e5;color:#fff;font-size:30px;border:0;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px}.box button{padding:12px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.toast{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:300}.toast.show{display:block}.whoBtn{width:100%;padding:16px;margin:6px 0;border:0;border-radius:16px;background:#4f46e5;color:#fff;font-size:18px;font-weight:700;cursor:pointer}.syncBox{background:#fff8dc;border:1px solid #fde68a;border-radius:16px;padding:14px;text-align:center;margin-top:12px}.syncBox button{width:100%;padding:13px;border:0;border-radius:12px;background:#25D366;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.codigoBox{background:#fff;border:1px dashed #999;padding:12px;border-radius:10px;font-size:13px;font-weight:800;word-break:break-all;text-align:center;margin:10px 0}.gerRow{display:flex;gap:8px;align-items:center;background:#f9fafb;padding:12px;border-radius:14px;margin:8px 0}.gerRow b{flex:1}.resumo{font-size:13px;background:#f0fdf4;border-radius:12px;padding:10px;margin-top:8px;text-align:center;font-weight:700}.resumo b{color:#16a34a}.editValor{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}.editValor input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0}.alertaMin{background:#fef3c7;border-radius:12px;padding:10px;text-align:center;font-weight:800;color:#92400e;margin-top:8px}.cliqueAqui{font-size:12px;color:#888;text-align:center;margin-top:4px}.histDia{background:#f9fafb;border-radius:14px;padding:12px;margin:8px 0}.histDia p{font-size:13px;margin-top:4px;line-height:1.5}.presetBtn{border:1px solid #e5e7eb;background:#f9fafb;padding:9px 10px;border-radius:99px;font-size:13px;cursor:pointer;font-weight:600;margin:3px}.dupla{display:flex;gap:10px}.miniCard{flex:1;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border-radius:20px;padding:14px;text-align:center;cursor:pointer;min-width:0}.miniCard b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.miniCard h2{font-size:26px;margin:4px 0}.miniCard p{font-size:12px;opacity:.9}.bancoItem{display:flex;align-items:center;gap:8px;padding:12px 4px;border-top:1px solid #eee}.bancoItem b{flex:1;font-size:15px}.bancoItem button{border:0;background:transparent;font-size:16px;cursor:pointer}</style></head><body>
<div class="toast" id="toast"></div>
<div class="header"><small>Ola! Seja Bem Vindo!</small><h1 id="titulo">Tarefas das Meninas</h1><span class="date" id="dataTopo"></span></div>
<div class="wrap" id="lista"></div>
<div class="fab" id="fab"><div class="fab-menu"><button style="background:#22c55e;color:#fff" id="btnNovaTarefaFab">+ Nova Tarefa</button><button style="background:#4f46e5;color:#fff" id="btnFilhaFab">+ Nova Filha</button><button style="background:#fff;color:#111" id="btnGerenciarFab">Gerenciar Filhas</button><button style="background:#fff;color:#111" id="btnCompartilharFab">Link pras filhas</button><button style="background:#fff;color:#111" id="btnImportarFab">Importar</button><button style="background:#f59e0b;color:#fff" id="btnVerFilhosFab">Ver como filhas veem</button></div><button class="fab-main" id="btnFab">+</button></div>
<div class="modal" id="modalTarefa"><div class="box"><h2>Nova Tarefa</h2><p style="color:#666;font-size:13px">Vai pra todas. Depois manda o link novo.</p><input id="buscaTarefa" placeholder="Digita: dente, quarto..."><div id="listaPreset"></div><p style="font-weight:800;margin:10px 0 4px">Ou digita a sua:</p><input id="inNomeTarefa" placeholder="Ex: arrumar quarto"><div style="display:flex;gap:8px"><button style="background:#eee;flex:1" class="fechar">Cancelar</button><button style="background:#22c55e;color:#fff;flex:1" id="saveTarefa">Adicionar</button></div></div></div>
<div class="modal" id="modalFilha"><div class="box"><h2 id="titFilha">+ Filha</h2><input id="inNomeFilha" placeholder="Ex: Rafa"><div style="display:flex;gap:8px"><button style="background:#eee;flex:1" class="fechar">Cancelar</button><button style="background:#4f46e5;color:#fff;flex:1" id="saveFilha">Salvar</button></div></div></div>
<div class="modal" id="modalGerenciar"><div class="box"><h2>Gerenciar Filhas</h2><div id="listaGerenciar"></div><button style="background:#4f46e5;color:#fff;width:100%;margin-top:10px" id="btnAddGerenciar">+ Cadastrar outra filha</button><button style="background:#eee;width:100%;margin-top:6px" class="fechar">Fechar</button></div></div>
<div class="modal" id="modalLink"><div class="box"><h2>Link pras Filhas</h2><input id="linkCopia" readonly><button style="background:#4f46e5;color:#fff;width:100%;margin-top:6px" id="btnCopiarLink">Copiar link</button><button style="background:#25D366;color:#fff;width:100%;margin-top:6px" id="btnZapLink">Mandar no WhatsApp</button><button style="background:#eee;width:100%;margin-top:8px" class="fechar">Fechar</button></div></div>
<div class="modal" id="modalCodigo"><div class="box"><h2 id="titCodigo">Codigo</h2><p id="txtCodigo" style="color:#666;margin:8px 0"></p><div class="codigoBox" id="codigoGerado"></div><input id="inCodigo" placeholder="Cole o codigo" style="text-transform:uppercase;text-align:center;font-weight:800"><button style="background:#25D366;color:#fff;width:100%" id="btnZapCodigo">Mandar no WhatsApp</button><button style="background:#4f46e5;color:#fff;width:100%;margin-top:6px" id="btnImportarCodigo">Importar</button><button style="background:#eee;width:100%;margin-top:8px" class="fechar">Fechar</button></div></div>
<div class="modal" id="modalEditar"><div class="box"><h2>Editar tarefa</h2><input id="inEditarTarefa"><div style="display:flex;gap:8px"><button style="background:#eee;flex:1" class="fechar">Cancelar</button><button style="background:#4f46e5;color:#fff;flex:1" id="saveEditar">Salvar</button></div></div></div>
<script>
if(location.search.indexOf('limpar')>=0){localStorage.clear();location.href=location.pathname}
var params=new URLSearchParams(location.search);var MODO_FILHOS_URL=params.has('filhos');var filhaLogada=localStorage.getItem('filhaLogada')||'';
if(params.has('d')){try{var dl=JSON.parse(decodeURIComponent(atob(params.get('d'))));if(dl&&dl.filhas)localStorage.setItem('dadosClean',JSON.stringify(dl))}catch(e){}}
var dados=null;try{dados=JSON.parse(localStorage.getItem('dadosClean')||'null')}catch(e){dados=null}
var PRESET=['Escovar os dentes','Tomar banho sozinha','Pentear o cabelo','Guardar os brinquedos','Arrumar a cama','Arrumar o quarto','Ajudar a por a mesa','Lavar a louca','Dobrar roupa','Lavar roupa','Dar comida pro pet','Regar as plantas','Ajudar a cozinhar','Fazer licao de casa','Ler 10 minutos','Ler 20 minutos','Arrumar a mochila','Estudar pra prova','Estudar 30 minutos','Comer fruta / verdura','Dormir no horario','Sem celular apos 21h','Ajudar irmao / irma','Fazer exercicio','Racao e Agua pro Gato','Limpar caixinha do gato'];
if(!dados||!dados.filhas){dados={filhas:[],dia:'Seg',listaGeral:PRESET.slice(),valor:1};salvar()}
if(!dados.listaGeral)dados.listaGeral=PRESET.slice();if(dados.valor==null)dados.valor=1;
var SEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];function diaHoje(){return SEM[new Date().getDay()]}function hojeChave(){var n=new Date();return n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()}
var chaveHoje=new Date().getFullYear()+'-'+(new Date().getMonth()+1)+'-'+new Date().getDate();
if(localStorage.getItem('ultimoDiaClean')!==chaveHoje){dados.filhas.forEach(function(f){f.feitas={}});dados.dia=diaHoje();localStorage.setItem('ultimoDiaClean',chaveHoje);salvar()}
dados.filhas.forEach(function(f){if(!f.feitas)f.feitas={};if(!f.historico)f.historico=[];if(f.tarefas){f.tarefas.forEach(function(t){if(t.feito)f.feitas[t.nome]=true});delete f.tarefas}});
dados.listaGeral.sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase())});salvar();
function pontosValidos(f){var q=f.feitas?Object.keys(f.feitas).length:0;return q>=3?q:0}
function valorFormat(v){return 'R$ '+v.toFixed(2).replace('.',',')}
function salvar(){try{localStorage.setItem('dadosClean',JSON.stringify(dados))}catch(e){}}function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},2000)}function fecharModais(){document.querySelectorAll('.modal').forEach(function(m){m.classList.remove('open')})}function abrirModal(id){document.getElementById('fab').classList.remove('open');document.getElementById(id).classList.add('open')}
function gerarCodigo(){return dados.filhas.map(function(f){var l=f.nome.charAt(0).toUpperCase();var bits=dados.listaGeral.map(function(n){return f.feitas&&f.feitas[n]?'1':'0'}).join('')||'0';return l+bits}).join('-')}
function importarCodigo(cod){cod=(cod||'').toUpperCase().trim().replace(/[^A-Z0-9\-]/g,'');var ok=false;cod.split('-').forEach(function(p){if(p.length<2)return;var f=dados.filhas.find(function(x){return x.nome.charAt(0).toUpperCase()===p.charAt(0)});if(f){if(!f.feitas)f.feitas={};if(!f.historico)f.historico=[];var bits=p.slice(1);for(var i=0;i<Math.min(bits.length,dados.listaGeral.length);i++){var n=dados.listaGeral[i];if(bits[i]==='1'){if(!f.feitas[n]){f.feitas[n]=true;f.historico.push({tarefa:n,data:hojeChave(),ds:diaHoje()})}}else{delete f.feitas[n]}}ok=true}});return ok}
var editFilhaIdx=-1,editTarefaNome='',abertoHist={};
function abrirGerenciar(){var w=document.getElementById('listaGerenciar');w.innerHTML='';if(!dados.filhas.length)w.innerHTML='<p style="text-align:center;color:#888">Nenhuma filha.</p>';dados.filhas.forEach(function(f,idx){var r=document.createElement('div');r.className='gerRow';var b=document.createElement('b');b.textContent=f.nome;r.appendChild(b);var e=document.createElement('button');e.textContent='Editar';e.style.cssText='border:0;background:#e0e7ff;padding:8px 10px;border-radius:99px;cursor:pointer';e.onclick=function(){fecharModais();editFilhaIdx=idx;document.getElementById('titFilha').textContent='Editar Filha';document.getElementById('inNomeFilha').value=f.nome;abrirModal('modalFilha')};r.appendChild(e);var d=document.createElement('button');d.textContent='Excluir';d.style.cssText='border:0;background:#fee2e2;padding:8px 10px;border-radius:99px;cursor:pointer';d.onclick=function(){if(confirm('Excluir '+f.nome+'?')){dados.filhas.splice(idx,1);salvar();abrirGerenciar();render()}};r.appendChild(d);w.appendChild(r)});abrirModal('modalGerenciar')}
function abrirNovaTarefa(){document.getElementById('inNomeTarefa').value='';document.getElementById('buscaTarefa').value='';renderPreset('');abrirModal('modalTarefa')}
function renderPreset(busca){var w=document.getElementById('listaPreset');w.innerHTML='';PRESET.filter(function(n){return !busca||n.toLowerCase().indexOf(busca)>=0}).forEach(function(n){var b=document.createElement('button');b.className='presetBtn';b.textContent=(dados.listaGeral.indexOf(n)>=0?'OK ':'')+n;b.onclick=function(){document.getElementById('inNomeTarefa').value=n};w.appendChild(b)})}
function gerarLink(){try{return location.href.split('?')[0]+'?filhos&d='+btoa(encodeURIComponent(JSON.stringify(dados)))}catch(e){return location.href.split('?')[0]+'?filhos'}}
function agrupar(f){var g={};(f.historico||[]).forEach(function(h){var k=h.ds+' '+h.data;if(!g[k])g[k]=[];g[k].push(h.tarefa)});return g}
function render(){var lista=document.getElementById('lista');lista.innerHTML='';var isFilhos=document.body.classList.contains('filhos')||MODO_FILHOS_URL;document.getElementById('dataTopo').textContent=dados.dia+', '+new Date().getDate()+' de Nov';
if(isFilhos&&MODO_FILHOS_URL&&!filhaLogada){if(!dados.filhas.length){lista.innerHTML+='<p style="text-align:center;color:#888;padding:20px">Nenhuma filha. Pede pra mamae mandar link novo.</p>';return}var h=document.createElement('h2');h.style.textAlign='center';h.textContent='Ola! Quem e voce?';lista.appendChild(h);dados.filhas.forEach(function(f){var b=document.createElement('button');b.className='whoBtn';b.textContent=f.nome;b.onclick=function(){filhaLogada=f.nome;localStorage.setItem('filhaLogada',f.nome);render()};lista.appendChild(b)});return}
var mostrar=dados.filhas;if(isFilhos&&MODO_FILHOS_URL&&filhaLogada)mostrar=dados.filhas.filter(function(f){return f.nome===filhaLogada});
if(!isFilhos){
var boxV=document.createElement('div');boxV.className='editValor';boxV.innerHTML='<b>Valor de cada tarefa</b><p style="font-size:12px;color:#666">Muda aqui que muda pra todo mundo.</p>';var inpV=document.createElement('input');inpV.type='number';inpV.step='0.10';inpV.min='0';inpV.value=dados.valor;inpV.onchange=function(){var v=parseFloat(inpV.value);if(!isNaN(v)&&v>=0){dados.valor=v;salvar();render();toast('Valor: '+valorFormat(v))}};boxV.appendChild(inpV);var pV=document.createElement('p');pV.style.cssText='font-size:12px;text-align:center;font-weight:800';pV.textContent='1 ponto = '+valorFormat(dados.valor)+' - Minimo 3 tarefas/dia';boxV.appendChild(pV);lista.appendChild(boxV);
if(dados.filhas.length){
var dupla=document.createElement('div');dupla.className='dupla';lista.appendChild(dupla);
dados.filhas.forEach(function(f,fi){
var totalHist=(f.historico||[]).length;var qHoje=f.feitas?Object.keys(f.feitas).length:0;var ptsHoje=pontosValidos(f);
var mini=document.createElement('div');mini.className='miniCard';mini.innerHTML='<b>'+f.nome+'</b><h2>'+valorFormat(totalHist*dados.valor)+'</h2><p>'+totalHist+' tarefas no total</p><p>Hoje: '+qHoje+' tarefas - '+valorFormat(ptsHoje*dados.valor)+'</p><span>Clica pra ver o que ela fez</span>';
var cardHist=document.createElement('div');cardHist.className='card';cardHist.style.display=abertoHist[fi]?'block':'none';cardHist.innerHTML='<b>'+f.nome+' - so o que ela fez</b>';
var g=agrupar(f);var ks=Object.keys(g);
if(!ks.length){var vv=document.createElement('p');vv.style.cssText='color:#888;font-size:13px;margin-top:8px';vv.textContent='Ainda nao fez nenhuma.';cardHist.appendChild(vv)}else{ks.reverse().forEach(function(k){var d=document.createElement('div');d.className='histDia';var q=g[k].length;var pts=q>=3?q:0;d.innerHTML='<b>'+k+'</b><p>'+g[k].join(', ')+'</p><small>'+q+' tarefas = '+(pts?valorFormat(pts*dados.valor):'R$ 0,00 - faltou minimo de 3')+'</small>';cardHist.appendChild(d)})}
mini.onclick=function(){var aberto=cardHist.style.display!=='block';cardHist.style.display=aberto?'block':'none';abertoHist[fi]=aberto};
dupla.appendChild(mini);lista.appendChild(cardHist);
});
var banco=document.createElement('div');banco.className='card';banco.innerHTML='<b>Banco de tarefas - so pra editar</b><p style="font-size:12px;color:#888">Aqui voce edita, inclui e exclui. Nao ta ligado a ninguem. E o que vai aparecer pra elas.</p>';
dados.listaGeral.forEach(function(nome){var row=document.createElement('div');row.className='bancoItem';var bb=document.createElement('b');bb.textContent=nome;row.appendChild(bb);var bE=document.createElement('button');bE.textContent='Editar';bE.onclick=function(){editTarefaNome=nome;document.getElementById('inEditarTarefa').value=nome;abrirModal('modalEditar')};row.appendChild(bE);var bD=document.createElement('button');bD.textContent='Excluir';bD.onclick=function(){if(confirm('Excluir "'+nome+'" pra todo mundo?')){dados.listaGeral=dados.listaGeral.filter(function(x){return x!==nome});dados.filhas.forEach(function(ff){if(ff.feitas)delete ff.feitas[nome]});salvar();render()}};row.appendChild(bD);banco.appendChild(row)});
var btnAdd=document.createElement('button');btnAdd.style.cssText='width:100%;padding:12px;border:0;border-radius:12px;background:#22c55e;color:#fff;font-weight:800;margin-top:10px;cursor:pointer';btnAdd.textContent='+ Adicionar tarefa nova';btnAdd.onclick=function(){abrirNovaTarefa()};banco.appendChild(btnAdd);lista.appendChild(banco);
}else{var v=document.createElement('div');v.className='card';v.innerHTML='<p style="text-align:center">Nenhuma filha.<br>Clica no <b>+</b> pra cadastrar.</p>';lista.appendChild(v)}
return;
}
mostrar.forEach(function(f){var fi=dados.filhas.indexOf(f);var hoje=dados.listaGeral.slice().sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase())});
var qFez=f.feitas?Object.keys(f.feitas).length:0;var pts=pontosValidos(f);var card=document.createElement('div');card.className='card aberto';var top=document.createElement('div');top.className='card-top';top.innerHTML='<b>'+f.nome+'</b><span><b>'+pts+' pts - '+valorFormat(pts*dados.valor)+'</b> <span class="seta">V</span></span>';top.onclick=function(){card.classList.toggle('aberto')};card.appendChild(top);var barra=document.createElement('div');barra.className='barra';barra.innerHTML='<div style="width:'+(hoje.length?Math.round(qFez/hoje.length*100):0)+'%"></div>';card.appendChild(barra);
var res=document.createElement('div');res.className='resumo';res.innerHTML='Hoje voce fez <b>'+qFez+' tarefas</b> = <b>'+pts+' pontos = '+valorFormat(pts*dados.valor)+'</b><br><span style="font-weight:400;color:#666">Hoje e '+diaHoje()+' '+hojeChave()+' - Minimo 3 pra liberar</span>';card.appendChild(res);
if(qFez>0&&qFez<3){var al=document.createElement('div');al.className='alertaMin';al.textContent='Falta '+(3-qFez)+' tarefa(s) pra liberar! Minimo 3 por dia.';card.appendChild(al)}
var cl=document.createElement('p');cl.className='cliqueAqui';cl.textContent='Clica aqui em cima pra abrir / fechar a lista';card.appendChild(cl);
var wrap=document.createElement('div');wrap.className='listaTarefas';if(!hoje.length){var e=document.createElement('div');e.className='empty';e.textContent='Nenhuma tarefa.';wrap.appendChild(e)}
hoje.forEach(function(nome){var feito=f.feitas&&f.feitas[nome];var row=document.createElement('div');row.className='task'+(feito?' feita':'');var chk=document.createElement('input');chk.type='checkbox';chk.checked=!!feito;
function validar(){if(!f.feitas)f.feitas={};if(!f.historico)f.historico=[];if(f.feitas[nome]){delete f.feitas[nome];f.historico=f.historico.filter(function(h){return !(h.tarefa===nome&&h.data===hojeChave())})}else{f.feitas[nome]=true;f.historico.push({tarefa:nome,data:hojeChave(),ds:diaHoje()})}salvar();render();}
row.onclick=function(e){e.stopPropagation();validar()};
